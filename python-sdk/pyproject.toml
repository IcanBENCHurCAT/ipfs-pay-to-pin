[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ipfs-pay-to-pin-client"
version = "2.0.0"
description = "Python client library for pinning files via IPFS Pay-to-Pin microUSDC gateway across Base, Solana, Algorand."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
  { name = "Pay-to-Pin Maintainers" }
]
dependencies = [
  "requests>=2.28.0"
]

[project.optional-dependencies]
algorand = [
  "py-algorand-sdk>=2.0.0"
]
evm = [
  "eth-account>=0.8.0"
]
solana = [
  "solders>=0.18.0"
]
all = [
  "py-algorand-sdk>=2.0.0",
  "eth-account>=0.8.0",
  "solders>=0.18.0"
]
dev = [
  "pytest>=7.0.0",
  "py-algorand-sdk>=2.0.0",
  "eth-account>=0.8.0",
  "solders>=0.18.0"
]

[tool.hatch.build.targets.wheel]
packages = ["src/ipfs_pay_to_pin_client"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
