[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ipfs-pay-to-pin-client"
version = "2.0.2"
description = "Python client library for pinning files to IPFS via x402 microUSDC micropayments across Base L2, Solana, Algorand, and Ethereum L1."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Pay-to-Pin Maintainers" }
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Security :: Cryptography",
]
dependencies = [
  "requests>=2.28.0"
]

[project.urls]
Homepage = "https://pay-to-pin.duckdns.org"
Repository = "https://github.com/IcanBENCHurCAT/ipfs-pay-to-pin"
Changelog = "https://github.com/IcanBENCHurCAT/ipfs-pay-to-pin/releases"
Issues = "https://github.com/IcanBENCHurCAT/ipfs-pay-to-pin/issues"

[project.optional-dependencies]
algorand = [
  "py-algorand-sdk>=2.0.0"
]
evm = [
  "eth-account>=0.8.0"
]
solana = [
  "solders>=0.18.0"
]
all = [
  "py-algorand-sdk>=2.0.0",
  "eth-account>=0.8.0",
  "solders>=0.18.0"
]
dev = [
  "pytest>=7.0.0",
  "py-algorand-sdk>=2.0.0",
  "eth-account>=0.8.0",
  "solders>=0.18.0"
]

[tool.hatch.build.targets.wheel]
packages = ["src/ipfs_pay_to_pin_client"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
