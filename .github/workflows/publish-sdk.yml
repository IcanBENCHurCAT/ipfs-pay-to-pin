name: Publish Client SDK to npm

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional package version override (e.g. 1.0.0 or leave empty to use sdk/package.json)'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install SDK Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build SDK Bundle & Type Declarations
        run: pnpm --filter sdk run build

      - name: Publish to npm
        run: pnpm publish --filter sdk --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
