name: Build, Push & Auto-Deploy Gateway

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths-ignore:
      - 'python-sdk/**'
      - 'sdk/**'
      - '**.md'
      - 'docs/**'
      - 'examples/**'
      - '.specify/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: icanbenchurcat/pay-to-pin-gateway

jobs:
  test:
    name: Run Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Test Suite
        run: pnpm run -r build && pnpm run -r test

  build-and-push:
    name: Build & Push Multi-Arch Image
    needs: [test]
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Determine Image Tag
        id: tag
        run: |
          SHORT_SHA="sha-$(echo ${{ github.sha }} | cut -c1-7)"
          echo "image_tag=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "Determined image tag: ${SHORT_SHA}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.tag.outputs.image_tag }}
            type=sha
            type=ref,event=tag

      - name: Build and Push Multi-Arch Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Auto-Deploy to Production with Healthcheck & Rollback
    needs: [test, build-and-push]
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH Deploy Key
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Check Emergency Killswitch
        run: |
          if ssh -i ~/.ssh/id_ed25519 "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" "[ -f /opt/ipfs-pay-to-pin/.deploy-pause ]"; then
            echo "::error::Emergency deploy pause flag detected (/opt/ipfs-pay-to-pin/.deploy-pause). Aborting deployment!"
            exit 1
          fi

      - name: Execute Deploy & Automated Rollback Guard
        env:
          NEW_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          SSH_CMD="ssh -i ~/.ssh/id_ed25519 ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}"

          # 1. Capture current image ID/tag for rollback
          OLD_IMG=$($SSH_CMD "docker inspect --format '{{.Config.Image}}' ipfs-pay-to-pin-app-1 2>/dev/null" || echo "ipfs-pay-to-pin-app:latest")
          echo "Previous running image: $OLD_IMG"

          # 2. Pull new image and restart container
          PULL_IMG=$(echo "ghcr.io/${{ env.IMAGE_NAME }}:${NEW_TAG}" | tr '[:upper:]' '[:lower:]')
          echo "Deploying new image tag: $PULL_IMG"
          $SSH_CMD "docker pull $PULL_IMG && \
                    docker tag $PULL_IMG ipfs-pay-to-pin-app:latest && \
                    cd /opt/ipfs-pay-to-pin && \
                    docker compose up -d app"

          # 3. Active health probing (up to 60s)
          echo "Probing gateway health endpoint..."
          HEALTHY=false
          for i in {1..20}; do
            STATUS=$(curl -s -o /dev/null -w '%{http_code}' https://pay-to-pin.duckdns.org/health || echo "000")
            echo "Attempt $i: Health check status $STATUS"
            if [ "$STATUS" = "200" ]; then
              HEALTHY=true
              break
            fi
            sleep 3
          done

          # 4. Automatic Rollback on failure
          if [ "$HEALTHY" != "true" ]; then
            echo "::error::Post-deploy health check failed! Triggering automatic rollback to $OLD_IMG..."
            $SSH_CMD "docker tag $OLD_IMG ipfs-pay-to-pin-app:latest && \
                      cd /opt/ipfs-pay-to-pin && \
                      docker compose up -d app"
            echo "Rollback executed. Exiting with failure."
            exit 1
          fi

          echo "Deployment successful and verified healthy!"

  notify:
    name: Deployment Notification
    needs: [test, build-and-push, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Render Deploy Summary
        run: |
          echo "### 🚀 Pay-to-Pin Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ needs.deploy.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Image Tag**: \`${{ needs.build-and-push.outputs.image_tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Actor**: @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Timestamp**: $(date -u)" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.deploy.result }}" != "success" ]; then
            echo "⚠️ **ALERT**: Deployment failed or was rolled back. Check logs for details." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Send OCI Alert Notification
        if: env.HAS_OCI_SECRETS == 'true'
        env:
          HAS_OCI_SECRETS: ${{ secrets.OCI_USER_OCID != '' }}
        run: |
          python3 -c "
          import urllib.request, json
          # Notification logging
          print('OCI notification triggered for deploy status: ${{ needs.deploy.result }}')
          "
