name: Build & Deploy Gateway Container to OCI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to OCI Container Registry (OCIR)
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.OCIR_REGION_ENDPOINT }} # e.g. iad.ocir.io
          username: ${{ secrets.OCIR_USERNAME }}
          password: ${{ secrets.OCIR_AUTH_TOKEN }}

      - name: Build and Push Multi-Arch Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.OCIR_REGION_ENDPOINT }}/${{ secrets.OCI_TENANCY_NAMESPACE }}/pay-to-pin-gateway:latest
            ${{ secrets.OCIR_REGION_ENDPOINT }}/${{ secrets.OCI_TENANCY_NAMESPACE }}/pay-to-pin-gateway:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
