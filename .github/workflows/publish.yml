name: Publish Client SDKs

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      target:
        description: 'Target SDK to publish (all, npm, pypi)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - npm
          - pypi

permissions:
  contents: read
  id-token: write

jobs:
  publish-npm:
    name: Publish NPM Package
    if: ${{ github.event_name == 'release' || github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'npm' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          registry-url: 'https://registry.npmjs.org'

      - name: Install SDK Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build SDK Bundle & Type Declarations
        run: pnpm --filter ipfs-pay-to-pin-client run build

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        if: ${{ env.NODE_AUTH_TOKEN != '' }}
        run: pnpm publish --filter ipfs-pay-to-pin-client --access public --no-git-checks

  publish-pypi:
    name: Publish PyPI Package
    if: ${{ github.event_name == 'release' || github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'pypi' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install build tool
        run: python -m pip install build

      - name: Build Python Package
        run: |
          cd python-sdk
          python -m build

      - name: Publish Package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        continue-on-error: true
        with:
          packages-dir: python-sdk/dist/
